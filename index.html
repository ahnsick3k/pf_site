<head>

            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin: 0;

        }

        .subtitle {
            font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;
            color: #e60012;
            text-transform: uppercase;
            letter-spacing: 0.35em;

<body>
    <div class="stage">
